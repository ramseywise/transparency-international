[project]
name = "transparency-international"
version = "0.1.0"
description = "Research workspace: who attends UNFCCC climate conferences, and for whom"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "jinja2>=3.1.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "duckdb>=1.1",
    "rapidfuzz>=3.9",
    "pyarrow>=17",
    "numpy>=2.0",
    "fastembed>=0.9.1",
    "mcp>=2.3.0",
    "anthropic>=2.13.0",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "pytest>=8.3",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["unfccc/src", "literature/src", "mcp_server/src"]
sources = ["unfccc/src", "literature/src", "mcp_server/src"]

[tool.hatch.build]
dev-mode-dirs = ["unfccc/src", "literature/src", "mcp_server/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["unfccc/src", "unfccc/tests", "literature/src", "literature/tests", ".claude/skills/run-evals", ".claude/scripts", "mcp_server/src", "mcp_server/tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["unfccc/tests", "literature/tests", ".claude/skills/run-evals/tests", ".claude/scripts/tests", "mcp_server/tests"]
